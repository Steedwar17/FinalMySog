<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego - Videojuego Multijugador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a3e;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .logo { font-size: 1.2rem; font-weight: 700; color: #7b68ee; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .user-badge {
      background: #2a2a3e;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #7b68ee;
      font-weight: 600;
    }

    /* Selector de equipo */
    .team-selector {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: #aaa;
    }

    .btn-team {
      padding: 0.35rem 0.9rem;
      border: 2px solid transparent;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-team.red {
      background: #3a1a1a;
      color: #ff6666;
      border-color: #7a2a2a;
    }

    .btn-team.red.active, .btn-team.red:hover {
      background: #ff4444;
      color: #fff;
      border-color: #ff4444;
    }

    .btn-team.blue {
      background: #1a1a3a;
      color: #6699ff;
      border-color: #2a2a7a;
    }

    .btn-team.blue.active, .btn-team.blue:hover {
      background: #4466ff;
      color: #fff;
      border-color: #4466ff;
    }

    .btn-logout {
      padding: 0.35rem 0.8rem;
      background: #3a1a1a;
      border: 1px solid #a03030;
      border-radius: 20px;
      color: #ff8888;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn-logout:hover { background: #4a2020; }

    main {
      flex: 1;
      display: flex;
      gap: 1rem;
      padding: 1rem;
      align-items: flex-start;
      justify-content: center;
    }

    .canvas-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    #game-canvas {
      display: block;
      border: 2px solid #2a2a3e;
      border-radius: 8px;
    }

    .controls-hint {
      color: #555;
      font-size: 0.8rem;
      text-align: center;
    }

    .side-panel {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-box {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 10px;
      padding: 1rem;
    }

    .panel-box h3 {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      color: #aaa;
    }

    .connection-meta {
      margin-top: 0.65rem;
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.78rem;
      color: #777;
    }

    #ping-value {
      color: #e0e0ff;
      font-weight: 700;
    }

    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #888;
      flex-shrink: 0;
    }

    .status-dot.connected    { background: #44ff88; box-shadow: 0 0 5px #44ff88; }
    .status-dot.disconnected { background: #ff4444; box-shadow: 0 0 5px #ff4444; }
    .status-dot.connecting   { background: #ffaa44; box-shadow: 0 0 5px #ffaa44; }

    #players-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }

    .player-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.6rem;
      background: #14142a;
      border-radius: 8px;
      font-size: 0.82rem;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .player-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .player-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .team-tag {
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 8px;
      font-weight: 700;
    }
    .team-tag.red  { background: #3a1a1a; color: #ff6666; }
    .team-tag.blue { background: #1a1a3a; color: #6699ff; }
    .team-tag.none { background: #2a2a3e; color: #888; }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .score-team { display: flex; flex-direction: column; gap: 0.2rem; }
    .score-label { font-size: 0.75rem; font-weight: 700; }
    .score-label.red  { color: #ff6666; }
    .score-label.blue { color: #6699ff; }
    .score-count { font-size: 1.5rem; font-weight: 700; color: #e0e0ff; }

    .alert-box {
      display: none;
      position: fixed;
      top: 1rem; left: 50%; transform: translateX(-50%);
      background: #3a1a1a;
      border: 1px solid #a03030;
      color: #ff8888;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      z-index: 50;
      font-size: 0.9rem;
    }
    .alert-box.show { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎮 Multijugador</div>
    <div class="header-right">
      <span class="user-badge" id="current-username">...</span>

      <div class="team-selector">
        <span>Equipo:</span>
        <button class="btn-team red"  id="btn-red"  onclick="selectTeam('red')">🔴 Rojos</button>
        <button class="btn-team blue" id="btn-blue" onclick="selectTeam('blue')">🔵 Azules</button>
      </div>

      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <div class="alert-box" id="alert-box"></div>

  <main>
    <div class="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
      <p class="controls-hint">Mover: WASD o flechas</p>
    </div>

    <div class="side-panel">
      <!-- Estado de conexión -->
      <div class="panel-box">
        <h3>Conexión</h3>
        <div class="status-bar">
          <div class="status-dot connecting" id="status-dot"></div>
          <span id="status-text">Conectando...</span>
        </div>
        <div class="connection-meta">
          <span>Ping</span>
          <span id="ping-value">-- ms</span>
        </div>
      </div>

      <div class="panel-box">
        <h3>Marcador</h3>
        <div class="scoreboard">
          <div class="score-team">
            <span class="score-label red">🔴 Rojos</span>
            <span class="score-count" id="score-red">0</span>
          </div>
          <div class="score-team">
            <span class="score-label blue">🔵 Azules</span>
            <span class="score-count" id="score-blue">0</span>
          </div>
        </div>
      </div>

      <div class="panel-box">
        <h3>Jugadores (<span id="player-count">0</span>)</h3>
        <ul id="players-list"></ul>
      </div>
    </div>
  </main>

  <script src="/config.js"></script>
  <script type="module">
    import { createGame } from './game.js';

    const token    = localStorage.getItem('token');
    const username = localStorage.getItem('username');

    if (!token) {
      window.location.href = 'login.html';
    }

    document.getElementById('current-username').textContent = '👤 ' + (username || '...');

    const COORDINATOR_WS = window.COORDINATOR_WS_URL || 'ws://localhost:5000';

    window.lastState = null;

    let myUserId   = null;
    let myTeam     = null; 
    let ws         = null;
    let game       = null;
    let lastPlayersPanelKey = '';
    let pingTimer  = null;

    function connect() {
      setStatus('connecting', 'Conectando...');

      ws = new WebSocket(`${COORDINATOR_WS}/connect?token=${token}`);

      ws.onopen = () => {
        setStatus('connected', 'Conectado');
        startPingMonitor();
      };

      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }

        if (msg.type === 'pong') {
          updatePing(msg.sentAt);
          return;
        }

        if (msg.type === 'welcome') {
          myUserId = msg.you.userId;
          initGame(msg.world);
          return;
        }
        if (msg.type === 'state') {
          const enriched = {
            ...msg,
            players: msg.players.map(p => ({
              ...p,
              extras: {
                ...(p.extras || {}),
                color: teamColor(p.extras && p.extras.team)
              }
            }))
          };

          window.lastState = enriched;
          updateSidePanel(msg.players);
          return;
        }
        if (msg.type === 'players_update') {
          updateSidePanel(msg.players);
          return;
        }
      };

      ws.onclose = (event) => {
        setStatus('disconnected', 'Desconectado');
        stopPingMonitor();

        if (game) { game.stop(); }

        const reason = event.code === 4001
          ? 'Token inválido o vencido.'
          : 'Conexión perdida con el servidor.';

        showAlert(reason + ' Volviendo al login...');
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        setTimeout(() => { window.location.href = 'login.html'; }, 2500);
      };

      ws.onerror = () => {
        setStatus('disconnected', 'Error de conexión');
        stopPingMonitor();
      };
    }

    function startPingMonitor() {
      stopPingMonitor();
      sendPing();
      pingTimer = setInterval(sendPing, 1000);
    }

    function stopPingMonitor() {
      if (pingTimer) {
        clearInterval(pingTimer);
        pingTimer = null;
      }
      document.getElementById('ping-value').textContent = '-- ms';
    }

    function sendPing() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'ping', sentAt: performance.now() }));
    }

    function updatePing(sentAt) {
      if (typeof sentAt !== 'number') return;
      const ping = Math.max(0, Math.round(performance.now() - sentAt));
      document.getElementById('ping-value').textContent = `${ping} ms`;
    }

    function initGame(world) {
      game = createGame({
        canvas: document.getElementById('game-canvas'),
        onIntent: (intent) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'intent', intent }));
          }
        },
        getRenderState: () => window.lastState,

        localPlayerId: myUserId,

        options: {
          worldWidth:   world.width        || 800,
          worldHeight:  world.height       || 600,
          playerRadius: world.playerRadius || 20,
        }
      });

      game.start();
    }
    window.selectTeam = function(team) {
      myTeam = team;

      // Actualizar botones
      document.getElementById('btn-red').classList.toggle('active', team === 'red');
      document.getElementById('btn-blue').classList.toggle('active', team === 'blue');

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'extras_update',
          extras: { team }
        }));
      }
    };

    function teamColor(team) {
      if (team === 'red')  return '#ff4444';
      if (team === 'blue') return '#4466ff';
      return null; 
    }

    function updateSidePanel(players) {
      const list     = document.getElementById('players-list');
      const countEl  = document.getElementById('player-count');
      const scoreRed = document.getElementById('score-red');
      const scoreBlu = document.getElementById('score-blue');

      countEl.textContent = players.length;

      let reds = 0, blues = 0;
      players.forEach(p => {
        const team = p.extras && p.extras.team;
        if (team === 'red')  reds++;
        if (team === 'blue') blues++;
      });
      scoreRed.textContent = reds;
      scoreBlu.textContent = blues;

      const panelKey = players.map(p => {
        const team = (p.extras && p.extras.team) || '';
        return `${p.userId}:${p.username}:${team}:${p.userId === myUserId}`;
      }).join('|');

      if (panelKey === lastPlayersPanelKey) return;
      lastPlayersPanelKey = panelKey;

      if (players.length === 0) {
        list.innerHTML = '<li style="color:#555;font-size:0.8rem">Sin jugadores</li>';
        return;
      }

      list.innerHTML = players.map(p => {
        const team  = (p.extras && p.extras.team) || null;
        const color = teamColor(team) || '#7b68ee';
        const isMe  = p.userId === myUserId;
        const tag   = team
          ? `<span class="team-tag ${team}">${team === 'red' ? '🔴' : '🔵'}</span>`
          : `<span class="team-tag none">—</span>`;
        return `
          <li class="player-item">
            <div class="player-dot" style="background:${color}"></div>
            <span class="player-name">${escapeHtml(p.username)}${isMe ? ' <small style="color:#7b68ee">(tú)</small>' : ''}</span>
            ${tag}
          </li>`;
      }).join('');
    }
    window.logout = function() {
      if (game) game.destroy();
      stopPingMonitor();
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'login.html';
    };

    function setStatus(state, text) {
      document.getElementById('status-dot').className = 'status-dot ' + state;
      document.getElementById('status-text').textContent = text;
    }

    function showAlert(msg) {
      const el = document.getElementById('alert-box');
      el.textContent = msg;
      el.classList.add('show');
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      return d.innerHTML;
    }
    connect();
  </script>
</body>
</html>
