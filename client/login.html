<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Videojuego Multijugador</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      color: #7b68ee;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .auth-status {
      text-align: center;
      color: #777;
      margin: -1.25rem 0 1.5rem;
      font-size: 0.78rem;
    }

    .auth-status strong {
      color: #aaa;
      font-weight: 600;
    }

    .spectator-link {
      display: block;
      text-align: center;
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      text-decoration: none;
    }

    .spectator-link:hover { color: #7b68ee; }

    .tabs {
      display: flex;
      border-bottom: 2px solid #2a2a3e;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.2s;
    }

    .tab-btn.active {
      color: #7b68ee;
      border-bottom: 2px solid #7b68ee;
      margin-bottom: -2px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #aaa;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #e0e0ff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #7b68ee; }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      background: #7b68ee;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    button[type="submit"]:hover { background: #6a57dd; }
    button[type="submit"]:disabled { background: #444; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: #555;
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a3e;
    }

    .google-btn-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 0.5rem;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }

    .modal h2 {
      font-size: 1.2rem;
      color: #7b68ee;
      margin-bottom: 0.5rem;
    }

    .modal p {
      color: #aaa;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .modal input {
      margin-bottom: 1rem;
    }

    .modal-btns {
      display: flex;
      gap: 0.75rem;
    }

    .btn-cancel {
      flex: 1;
      padding: 0.75rem;
      background: #2a2a3e;
      border: none;
      border-radius: 8px;
      color: #aaa;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-confirm {
      flex: 2;
      padding: 0.75rem;
      background: #7b68ee;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-confirm:disabled { background: #444; cursor: not-allowed; }

    .message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .message.error {
      background: #3a1a1a;
      border: 1px solid #a03030;
      color: #ff8888;
      display: block;
    }

    .message.success {
      background: #1a3a1a;
      border: 1px solid #30a030;
      color: #88ff88;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎮 Multijugador</h1>
    <p class="subtitle">Sistemas Distribuidos - Taller 7</p>
    <p class="auth-status">Auth: <strong id="auth-value">--</strong></p>
    <a class="spectator-link" href="spectator.html">Entrar como espectador</a>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
    </div>
    <div id="panel-login" class="tab-panel active">
      <div class="form-group">
        <label for="login-username">Usuario</label>
        <input type="text" id="login-username" placeholder="Tu nombre de usuario" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" placeholder="Tu contraseña" autocomplete="current-password" />
      </div>
      <button type="submit" id="btn-login" onclick="handleLogin()">Entrar</button>

      <div class="divider">o continuar con</div>

      <div class="google-btn-wrapper">
        <div id="google-btn-login"></div>
      </div>

      <div class="message" id="msg-login"></div>
    </div>
    <div id="panel-register" class="tab-panel">
      <div class="form-group">
        <label for="reg-username">Usuario</label>
        <input type="text" id="reg-username" placeholder="Elige un nombre de usuario" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <input type="password" id="reg-password" placeholder="Elige una contraseña" autocomplete="new-password" />
      </div>
      <button type="submit" id="btn-register" onclick="handleRegister()">Registrarse</button>

      <div class="divider">o continuar con</div>

      <div class="google-btn-wrapper">
        <div id="google-btn-register"></div>
      </div>

      <div class="message" id="msg-register"></div>
    </div>
  </div>
  <div class="modal-overlay" id="modal-username">
    <div class="modal">
      <h2>¡Bienvenido!</h2>
      <p>Es tu primer acceso con Google. Elige un nombre de usuario para el juego.</p>
      <input
        type="text"
        id="modal-username-input"
        placeholder="Ej: jugador42"
        maxlength="32"
      />
      
      <div class="message" id="msg-modal"></div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-confirm" id="btn-modal-confirm" onclick="confirmGoogleUsername()">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    if (localStorage.getItem('token')) {
      window.location.href = 'game.html';
    }

    const API_URL = window.API_BASE_URL || '/api';
    const AUTH_URLS = window.AUTH_URLS || [];
    setAuthDisplay(window.AUTH_ACTIVE_URL || (AUTH_URLS[0]) || '--');

    let pendingGoogleIdToken = null;
    let googleInitialized = false;
    let authStatusInFlight = false;

    async function refreshAuthStatus() {
      if (authStatusInFlight) return;
      authStatusInFlight = true;
      try {
        const res = await fetch(`${API_URL}/auth/status`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const data = await readJson(res);
        if (res.ok && data.activeUrl) {
          setAuthDisplay(data.activeUrl);
        }
      } catch {
        // Keep the last visible auth if the status probe fails.
      } finally {
        authStatusInFlight = false;
      }
    }

    setInterval(refreshAuthStatus, 1000);

    async function requestAuth(endpoint, method, body) {
      const res = await fetch(`${API_URL}${endpoint}`, {
        method,
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true',
        },
        body: body ? JSON.stringify(body) : undefined
      });
      updateAuthFromResponse(res);
      return res;
    }

    async function readJson(res) {
      try {
        return await res.json();
      } catch {
        return {};
      }
    }

    window.addEventListener('load', () => {
      if (typeof google === 'undefined') return;
      initGoogleSignIn();
    });

    function initGoogleSignIn() {
      if (googleInitialized) return;

      const clientId = window.GOOGLE_CLIENT_ID;
      if (!clientId) {
        console.warn('GOOGLE_CLIENT_ID no configurado en .env');
        // Ocultar los botones de Google y sus divisores
        hideGoogleOptions();
        return;
      }

      googleInitialized = true;

      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleCredential,
        auto_select: false,
      });

      google.accounts.id.renderButton(
        document.getElementById('google-btn-login'),
        { theme: 'filled_black', size: 'large', text: 'signin_with', width: 340 }
      );

      google.accounts.id.renderButton(
        document.getElementById('google-btn-register'),
        { theme: 'filled_black', size: 'large', text: 'signup_with', width: 340 }
      );
    }

    function hideGoogleOptions() {
      // Ocultar los divs de Google y sus divisores en ambas pestañas
      const loginPanel = document.getElementById('panel-login');
      const registerPanel = document.getElementById('panel-register');

      const loginDivider = loginPanel.querySelector('.divider');
      const loginGoogleWrapper = loginPanel.querySelector('.google-btn-wrapper');
      const registerDivider = registerPanel.querySelector('.divider');
      const registerGoogleWrapper = registerPanel.querySelector('.google-btn-wrapper');

      if (loginDivider) loginDivider.style.display = 'none';
      if (loginGoogleWrapper) loginGoogleWrapper.style.display = 'none';
      if (registerDivider) registerDivider.style.display = 'none';
      if (registerGoogleWrapper) registerGoogleWrapper.style.display = 'none';
    }

    async function handleGoogleCredential(response) {
      const idToken = response.credential;
      await loginWithGoogle(idToken, null);
    }

    async function loginWithGoogle(idToken, username) {
      const body = { idToken };
      if (username) body.username = username;

      try {
        const res = await requestAuth('/auth/google', 'POST', body);
        const data = await readJson(res);

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          window.location.href = 'game.html';

        } else if (res.status === 409 && data.error === 'username_required') {
          pendingGoogleIdToken = idToken;
          openModal();

        } else if (res.status === 409 && data.error === 'username_taken') {
          showModalMessage('Ese nombre ya está tomado, elige otro.', 'error');

        } else {
          showMessage('msg-login', data.error || data.message || 'Error al autenticar con Google.', 'error');
        }

      } catch (err) {
        setAuthDisplay('sin respuesta');
        showMessage('msg-login', 'No se pudo conectar con el servidor de autenticación.', 'error');
      }
    }

    function openModal() {
      document.getElementById('modal-username').classList.add('show');
      document.getElementById('modal-username-input').focus();
      clearModalMessage();
    }

    function closeModal() {
      document.getElementById('modal-username').classList.remove('show');
      document.getElementById('modal-username-input').value = '';
      pendingGoogleIdToken = null;
      clearModalMessage();
    }

    async function confirmGoogleUsername() {
      const username = document.getElementById('modal-username-input').value.trim();
      if (!username) {
        showModalMessage('Por favor escribe un nombre de usuario.', 'error');
        return;
      }

      const btn = document.getElementById('btn-modal-confirm');
      btn.disabled = true;
      btn.textContent = 'Confirmando...';

      await loginWithGoogle(pendingGoogleIdToken, username);

      btn.disabled = false;
      btn.textContent = 'Confirmar';
    }

    //log local
    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        showMessage('msg-login', 'Por favor completa todos los campos.', 'error');
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await requestAuth('/login', 'POST', { username, password });
        const data = await readJson(res);

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          window.location.href = 'game.html';
        } else {
          showMessage('msg-login', data.error || data.message || 'Credenciales incorrectas.', 'error');
        }
      } catch (err) {
        setAuthDisplay('sin respuesta');
        showMessage('msg-login', 'No se pudo conectar con el servidor de autenticación.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    async function handleRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!username || !password) {
        showMessage('msg-register', 'Por favor completa todos los campos.', 'error');
        return;
      }

      const btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.textContent = 'Registrando...';

      try {
        const res = await requestAuth('/register', 'POST', { username, password });
        const data = await readJson(res);

        if (res.status === 201) {
          showMessage('msg-register', `¡Usuario "${data.username}" creado! Ahora inicia sesión.`, 'success');
          document.getElementById('reg-username').value = '';
          document.getElementById('reg-password').value = '';
          setTimeout(() => switchTab('login'), 1500);
        } else if (res.status === 409) {
          showMessage('msg-register', 'Ese nombre de usuario ya existe.', 'error');
        } else {
          showMessage('msg-register', data.error || data.message || 'Error al registrar.', 'error');
        }
      } catch (err) {
        setAuthDisplay('sin respuesta');
        showMessage('msg-register', 'No se pudo conectar con el servidor de autenticación.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Registrarse';
      }
    }

    // helpers
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-register').classList.toggle('active', tab === 'register');
      clearMessages();
    }

    function clearMessages() {
      ['msg-login', 'msg-register'].forEach(id => {
        const el = document.getElementById(id);
        el.className = 'message';
        el.textContent = '';
      });
    }

    function showMessage(id, text, type) {
      const el = document.getElementById(id);
      el.className = 'message ' + type;
      el.textContent = text;
    }

    function updateAuthFromResponse(res) {
      const authUrl = res.headers.get('X-Auth-Active-Url') || res.headers.get('X-Auth-Url');
      if (authUrl) setAuthDisplay(authUrl);
    }

    function setAuthDisplay(url) {
      const el = document.getElementById('auth-value');
      if (!el) return;
      el.textContent = 'Auth Service';
      el.title = url || '';
    }

    function compactAuthLabel(url) {
      // Ya no se usa, pero lo dejamos por compatibilidad
      return 'Auth Service';
    }

    function showModalMessage(text, type) {
      const el = document.getElementById('msg-modal');
      el.className = 'message ' + type;
      el.textContent = text;
    }

    function clearModalMessage() {
      const el = document.getElementById('msg-modal');
      el.className = 'message';
      el.textContent = '';
    }

    // Enter para enviar formularios
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('modal-username').classList.contains('show')) {
          confirmGoogleUsername();
          return;
        }
        const activePanel = document.querySelector('.tab-panel.active').id;
        if (activePanel === 'panel-login') handleLogin();
        else handleRegister();
      }
    });

    document.querySelector('script[src*="gsi/client"]').addEventListener('load', initGoogleSignIn);
  </script>
</body>
</html>
